name: Build ZHC V4.8.6 BIN

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 core
        run: |
          arduino-cli config init
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json

      - name: Install libraries
        run: |
          arduino-cli lib install "OneWire"
          arduino-cli lib install "DallasTemperature"

      - name: Reconstruct complete V4.8.6 sketch
        run: |
          mkdir -p build_sketch/Zoe_Heater_Controller_V4_8_6
          : > build_sketch/Zoe_Heater_Controller_V4_8_6/Zoe_Heater_Controller_V4_8_6.ino
          for f in firmware/v4_8_6_parts/part*.txt; do
            cat "$f" >> build_sketch/Zoe_Heater_Controller_V4_8_6/Zoe_Heater_Controller_V4_8_6.ino
            printf '\n' >> build_sketch/Zoe_Heater_Controller_V4_8_6/Zoe_Heater_Controller_V4_8_6.ino
          done
          wc -c build_sketch/Zoe_Heater_Controller_V4_8_6/Zoe_Heater_Controller_V4_8_6.ino
          grep -q 'FW_VERSION = "ZOE Heater Controller V4.8.6"' build_sketch/Zoe_Heater_Controller_V4_8_6/Zoe_Heater_Controller_V4_8_6.ino
          grep -q 'void setup()' build_sketch/Zoe_Heater_Controller_V4_8_6/Zoe_Heater_Controller_V4_8_6.ino
          grep -q 'void loop()' build_sketch/Zoe_Heater_Controller_V4_8_6/Zoe_Heater_Controller_V4_8_6.ino

      - name: Compile ESP32-C3
        run: |
          mkdir -p build_output
          arduino-cli compile \
            --fqbn esp32:esp32:esp32c3 \
            --output-dir build_output \
            build_sketch/Zoe_Heater_Controller_V4_8_6

      - name: List build files
        run: ls -lah build_output

      - name: Upload BIN artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZHC-V4.8.6-ESP32C3-BIN
          path: |
            build_output/*.bin
          if-no-files-found: error
